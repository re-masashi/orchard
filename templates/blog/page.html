{% extends "base.html" %}
{% block title %}{{ page.title }} | Masashi{% endblock %}
{% block content %}
<div class="flex flex-col mx-auto w-5/7 pt-10 px-[3vw] gap-4 font-mono">
  <div class="font-array flex flex-row gap-3">
    <p>{{ page.date | date(format="%B %d, %Y") }}</p>
    {% for t in page.extra.tags %}<p class="text-white/30">// {{ t }}</p>{% endfor %}
  </div>
  <h1 class="font-array text-5xl">{{ page.title }}</h1>
  <p class="font-mono text-white/50">
    {{ page.description }}
  </p>
  {{ page.content | safe }}
</div>
{% endblock %}
