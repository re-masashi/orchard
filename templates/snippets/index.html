{% extends "base.html" %}
{% block title %}Snippets | Masashi{% endblock %}
{% block content %}
<div class="flex flex-col w-full pt-10 px-[3vw] gap-3">
  <h1 class="font-array text-5xl">Snippets</h1>
  {% for snippet in section.pages %}
  <a
    href="{{ snippet.permalink }}"
    data-title="{{ snippet.title }}"
    data-description="{{ snippet.description }}"
    class="border border-white/10 p-2"
  >
    <h4 class="font-array text-base font-medium mb-0.5">
      {{ snippet.title }}
    </h4>
    <p class="text-fg-muted text-sm">
      {{ snippet.description }}
    </p>
  </a>
  {% endfor %}
</div>
{% endblock %}
